name: import-verified-bundle
on:
  push:
    paths:
      - .github/workflows/import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bundle and verify SHA-256
        env:
          BUNDLE_URL: https://ta.timelyai.co.kr/api/chats/45f793ca-3feb-46e8-9325-9247791f1a1b/files/session3-resumed-2026-11-05/Bucheonlibrary-mcp_upload_0.3-1.zip?dl=1&tok=1794466886.babf17257f67bf5db305496144a035e6df45d598ba9873124b65b69b586f40ff
          EXPECTED_SHA256: b105c6169d83c36d80920cf6270100f2530a8cbb302fec56bc77ac02b0a8f820
        run: |
          curl -fsSL "$BUNDLE_URL" -o /tmp/bundle.zip
          echo "$EXPECTED_SHA256  /tmp/bundle.zip" | sha256sum -c -
          unzip -o /tmp/bundle.zip -d .
          ls -la
      - name: Commit imported files
        run: |
          git config user.name "bundle-import"
          git config user.email "bundle-import@users.noreply.github.com"
          git add -A
          git commit -m "도서관 산책 읽기전용 MCP 서버 0.3 (검증된 묶음, sha256 b105c616...)"
          git push
